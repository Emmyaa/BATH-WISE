name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      # envied needs .env at build time. Without the secret (e.g. a PR from
      # a fork) a placeholder still builds; tests never call the network.
      - name: Create .env
        env:
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
        run: printf 'BOT_API_TOKEN=%s\n' "${BOT_API_TOKEN:-ci-placeholder}" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build -d

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test test_driver

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Golden diffs, to compare what Linux rendered with the macOS goldens.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: bath-wise-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
