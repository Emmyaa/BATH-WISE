name: bath_wise
description: "BathWise — Thai Baht exchange rates with official Bank of Thailand data."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  decimal: ^3.2.6
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  envied: ^1.3.10
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  rational: ^2.2.3
  riverpod_annotation: ^4.0.7
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  envied_generator: ^1.3.10
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: IBMPlexSansThai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
